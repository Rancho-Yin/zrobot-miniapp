<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="智显盒子小程序：5分钟完成内容生成、上屏与现场控制。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238848f5'/%3E%3Cpath d='M7 11h6V6h6v15h6v5h-12V16H7z' fill='white'/%3E%3C/svg%3E" />
  <title>智显机器人小程序原型</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="visual-studio.css" />
  <link rel="stylesheet" href="content-hub.css" />
</head>
<body>
  <main class="prototype-shell">
    <section class="phone" aria-label="智显机器人小程序高保真原型">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <div class="status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></div>
      </div>

      <header class="app-header">
        <button class="brand-button" type="button" data-route="home" aria-label="返回首页">
          <img src="assets/zrobot-mark.png" alt="智显机器人" />
          <span>智显机器人</span>
        </button>
        <button class="icon-button" id="themeButton" type="button" aria-label="切换深色模式"><i data-lucide="moon"></i></button>
        <button class="icon-button" id="profileButton" type="button" aria-label="个人中心"><i data-lucide="circle-user-round"></i></button>
      </header>

      <div class="app-content" id="appContent" aria-live="polite"></div>

      <nav class="tab-bar" aria-label="主导航">
        <button class="tab active" type="button" data-route="gallery"><i data-lucide="sparkles"></i><span>创作</span></button>
        <button class="tab" type="button" data-route="library"><i data-lucide="library"></i><span>内容库</span></button>
        <button class="tab" type="button" data-route="home"><i data-lucide="monitor"></i><span>屏幕</span></button>
        <button class="tab" type="button" data-route="profile"><i data-lucide="user-round"></i><span>我的</span></button>
      </nav>

      <div class="modal-layer" id="modalLayer" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script src="assets/lucide.min.js"></script>
  <script src="creation-scenarios.js"></script>
  <script src="visual-studio.js"></script>
  <script src="content-hub.js"></script>
  <script src="app.js"></script>
</body>
</html>
